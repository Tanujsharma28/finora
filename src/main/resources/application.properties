spring.application.name=finora-backend

# --- Database (MySQL) ---
# Defaults point at the finora-mysql container started by docker-compose
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/finora?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:finora}
spring.datasource.password=${DB_PASSWORD:finora}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway manages schema; Hibernate must never auto-generate DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Server ---
server.port=${PORT:8080}

# --- JWT ---
# A 512-bit (64 char) hex string used as the HS512 signing secret.
# Override via JWT_SECRET env-var in production.
jwt.secret=${JWT_SECRET:4a6f686e446f654a6f686e446f654a6f686e446f654a6f686e446f654a6f686e446f654a6f686e446f65}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.finora.backend.dto
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# --- Logging ---
logging.level.com.finora.backend=DEBUG
logging.level.org.springframework.security=INFO